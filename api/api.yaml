openapi: 3.0.3
info:
  title: API TPV
  version: 1.0.0
  description: |
    API REST para PLP (Pasa la Pasta).

    Los importes se expresan con dos decimales (`number`, `format: double`, `multipleOf: 0.01`).
tags:
  - name: Autenticación
    description: Inicio y cierre de sesión.
  - name: Caja
    description: Retiradas, saldo y pagos.
  - name: Reembolsos
    description: Solicitud, aceptación, rechazo y consulta de reembolsos.
  - name: Empresas
    description: Gestión de empresas (sólo administrador).
  - name: Pagos
    description: Consulta de pagos efectuados.
  - name: Tickets
    description: Gestión de tickets.

paths:
  /login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión y obtener token Bearer
      description: |
        Autentica a la empresa usuaria. El nombre de usuario se envía como parámetro de consulta
        y la contraseña en el cuerpo. Si falla el parámetro `user` se responde 400; si el usuario
        no existe o la contraseña es incorrecta, 401.
      security: []
      parameters:
        - $ref: "#/components/parameters/User"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Todo correcto; devuelve el token Bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 3600
                user:
                  id: usr_tpv01
                  name: Laura Martínez
                  role: tecnico
                  subtitle: Técnica de soporte
        "400":
          description: No se ha indicado el parámetro `user` o la petición está mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: MISSING_USER
                message: Falta el parámetro de consulta 'user'.
        "401":
          description: El usuario no existe o la contraseña es incorrecta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_CREDENTIALS
                message: Usuario o contraseña incorrectos.

  /logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: Invalida el token Bearer de la sesión actual.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Todo correcto; sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Sesión cerrada correctamente.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Algo fue mal al cerrar la sesión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LOGOUT_ERROR
                message: No se pudo cerrar la sesión.

  /withdraw:
    post:
      tags:
        - Caja
      summary: Retirar dinero del saldo de la empresa
      description: |
        Resta `amount` del saldo de la moneda indicada en `currency` (EUR por defecto).
        Un importe mal escrito o superior al saldo disponible de esa moneda produce un 400.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Todo correcto; retirada realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "400":
          description: El parámetro `amount` está mal escrito o es mayor que el saldo disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_AMOUNT
                message: El importe no es válido o supera el saldo disponible.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /balance:
    get:
      tags:
        - Caja
      summary: Consultar el saldo de la empresa autenticada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve el saldo de la empresa autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pay:
    post:
      tags:
        - Caja
      summary: Registrar y procesar un pago
      description: |
        Procesa un pago con los datos del ticket incluidos en el cuerpo: importe total, tipo de
        pago, productos comprados y datos de pago. Cuerpo mal formado → 400; pago rechazado → 422;
        saldo insuficiente → 409; error en el pago → 500.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "200":
          description: Todo correcto; pago realizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: El cuerpo de la petición está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: MALFORMED_BODY
                message: El cuerpo de la petición no es válido.
        "409":
          description: Saldo insuficiente para completar el pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INSUFFICIENT_BALANCE
                message: Saldo insuficiente.
        "422":
          description: El pago ha sido rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: PAYMENT_REJECTED
                message: El pago ha sido rechazado.
        "500":
          description: Ha habido un error al procesar el pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: PAYMENT_ERROR
                message: Error interno al procesar el pago.

  /refunds/request:
    post:
      tags:
        - Reembolsos
      summary: Solicitar un reembolso
      description: |
        Solicita el reembolso de una transacción. La petición se acepta para su procesamiento
        (202). Si el `transaction_id` no existe o está mal formado se responde 404.
      security: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - name: reason
          in: query
          required: false
          description: Motivo indicado por el comercio al solicitar la devolución.
          schema:
            type: string
            maxLength: 200
          example: El cliente solicita devolver los artículos del pedido.
      responses:
        "202":
          description: Todo correcto; solicitud de reembolso aceptada para procesamiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundRequestResponse"
        "404":
          description: El `transaction_id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TRANSACTION_NOT_FOUND
                message: La transacción indicada no existe o su identificador no es válido.

  /refunds/accept:
    post:
      tags:
        - Reembolsos
      summary: Aceptar un reembolso
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Todo correcto; reembolso aceptado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /refunds/reject:
    post:
      tags:
        - Reembolsos
      summary: Rechazar un reembolso
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Todo correcto; reembolso rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /refunds:
    get:
      tags:
        - Reembolsos
      summary: Listar todos los reembolsos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve todos los reembolsos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /companies/add:
    put:
      tags:
        - Empresas
      summary: Añadir una empresa (sólo administrador)
      description: Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyName"
      responses:
        "200":
          description: Todo correcto; empresa añadida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "403":
          $ref: "#/components/responses/Forbidden"

  /companies/delete:
    delete:
      tags:
        - Empresas
      summary: Dar de baja una empresa (sólo administrador)
      description: |
        Baja lógica: la empresa deja de estar activa pero conserva su histórico.
        Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Todo correcto; empresa dada de baja.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El `id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: COMPANY_NOT_FOUND
                message: La empresa indicada no existe o su identificador no es válido.

  /companies/reactivate:
    put:
      tags:
        - Empresas
      summary: Reactivar una empresa dada de baja (sólo administrador)
      description: Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Todo correcto; empresa reactivada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El `id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: COMPANY_NOT_FOUND
                message: La empresa indicada no existe o su identificador no es válido.

  /companies:
    get:
      tags:
        - Empresas
      summary: Listar todas las empresas (sólo administrador)
      description: Requiere token Bearer y credencial de administrador.
      x-required-role: admin
      security:
        - bearerAuth: []
          adminAuth: []
      responses:
        "200":
          description: Devuelve todas las empresas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /payments:
    get:
      tags:
        - Pagos
      summary: Listar todos los pagos efectuados
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve todos los pagos efectuados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ticket/add:
    post:
      tags:
        - Tickets
      summary: Añadir un ticket
      description: La información del ticket se envía en el cuerpo de la petición.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreateRequest"
      responses:
        "200":
          description: Todo correcto; ticket añadido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ticket/delete:
    delete:
      tags:
        - Tickets
      summary: Eliminar un ticket (sólo administrador)
      description: Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - adminAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Todo correcto; ticket eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Ticket eliminado correctamente.
        "403":
          $ref: "#/components/responses/Forbidden"

  /ticket/message:
    post:
      tags:
        - Tickets
      summary: Añadir un mensaje a la conversación del ticket
      description: |
        Añade un mensaje del usuario autenticado a la conversación del ticket. El autor y su
        rol se resuelven a partir del token. Un comercio solo puede escribir en sus tickets.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  maxLength: 1000
                  example: Gracias, todo aclarado.
      responses:
        "200":
          description: Todo correcto; ticket con el mensaje añadido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: El `id` no existe o no pertenece al comercio autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TICKET_NOT_FOUND
                message: El ticket indicado no existe o su identificador no es válido.

  /ticket/update:
    put:
      tags:
        - Tickets
      summary: Actualizar un ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdateRequest"
      responses:
        "200":
          description: Todo correcto; ticket actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: El `id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TICKET_NOT_FOUND
                message: El ticket indicado no existe o su identificador no es válido.

  /tickets:
    get:
      tags:
        - Tickets
      summary: Listar todos los tickets
      description: |
        Devuelve los tickets del usuario autenticado. El rol `comercio` solo recibe los tickets
        de su empresa; los roles técnicos reciben todos.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve todos los tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Bearer devuelto por `POST /login`.
    adminAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Credencial exclusiva de administrador para las operaciones marcadas como «SÓLO EL ADMIN».

  parameters:
    User:
      name: user
      in: query
      required: true
      description: Nombre de usuario. Si falta, la petición devuelve 400.
      schema:
        type: string
      example: tpv01
    Amount:
      name: amount
      in: query
      required: true
      description: Importe a retirar. Debe ser un número positivo con dos decimales como máximo y no superar el saldo de la moneda.
      schema:
        type: number
        format: double
        minimum: 0.01
        multipleOf: 0.01
      example: 25.5
    Currency:
      name: currency
      in: query
      required: false
      description: Moneda sobre la que se realiza la retirada. Por defecto `EUR`.
      schema:
        type: string
        enum:
          - EUR
          - USD
          - GBP
        default: EUR
      example: EUR
    TransactionId:
      name: transaction_id
      in: query
      required: true
      description: Identificador de la transacción. Si no existe o está mal formado, la petición devuelve 404.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
      example: txn_8f14e45fceea167a
    CompanyName:
      name: nombre
      in: query
      required: true
      description: Nombre de la empresa que se va a dar de alta.
      schema:
        type: string
        minLength: 1
      example: Comercio Ejemplo SL
    CompanyId:
      name: id
      in: query
      required: true
      description: Identificador de la empresa.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
      example: emp_001
    TicketId:
      name: id
      in: query
      required: true
      description: Identificador del ticket.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]+$"
      example: tkt_001

  responses:
    BadRequest:
      description: La petición está mal formada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token Bearer ausente, inválido o caducado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: La operación requiere permisos de administrador.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Algo fue mal en el servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Código de error de la API.
          example: INVALID_REQUEST
        message:
          type: string
          description: Descripción legible del error.
          example: La petición no es válida.
        details:
          type: object
          additionalProperties: true
          description: Información adicional opcional sobre el error.

    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Operación realizada correctamente.

    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: Contraseña del usuario indicado en el parámetro de consulta `user`.
          example: mi-contrasena

    LoginResponse:
      type: object
      required:
        - token
        - token_type
        - user
      properties:
        token:
          type: string
          description: "Token Bearer a enviar en la cabecera `Authorization: Bearer <token>`."
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          enum:
            - Bearer
          example: Bearer
        expires_in:
          type: integer
          description: Validez del token en segundos.
          example: 3600
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          example: usr_tpv01
        name:
          type: string
          example: Laura Martínez
        role:
          type: string
          enum:
            - admin
            - tecnico
            - comercio
          description: Rol del usuario autenticado.
          example: tecnico
        subtitle:
          type: string
          example: Técnica de soporte
        company_id:
          type: string
          description: Sólo para el rol `comercio`.
          example: emp_001
        company_name:
          type: string
          description: Sólo para el rol `comercio`.
          example: Comercio Ejemplo SL

    BalanceResponse:
      type: object
      required:
        - company
        - balances
      properties:
        company:
          type: string
          description: Nombre de la empresa autenticada.
          example: Comercio Ejemplo SL
        balances:
          type: array
          description: Saldo disponible por moneda.
          items:
            $ref: "#/components/schemas/BalanceAccount"

    BalanceAccount:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 1000.0

    WithdrawResponse:
      type: object
      required:
        - withdrawn
        - currency
        - balance
      properties:
        withdrawn:
          type: number
          format: double
          multipleOf: 0.01
          example: 25.5
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        balance:
          type: number
          format: double
          multipleOf: 0.01
          description: Saldo restante de esa moneda tras la retirada.
          example: 1225.25

    Product:
      type: object
      required:
        - product_id
        - name
        - quantity
        - unit_price
      properties:
        product_id:
          type: string
          example: P-123
        name:
          type: string
          example: Café
        quantity:
          type: integer
          minimum: 1
          example: 2
        unit_price:
          type: number
          format: double
          multipleOf: 0.01
          minimum: 0
          example: 1.5

    PaymentData:
      type: object
      description: Datos de pago correspondientes al tipo de pago elegido.
      properties:
        card_number:
          type: string
          example: "4111111111111111"
        expiry:
          type: string
          example: 12/28
        cvv:
          type: string
          example: "123"
        holder:
          type: string
          example: J. Pérez
        iban:
          type: string
          example: ES9121000418450200051332
      additionalProperties: true

    PaymentRequest:
      type: object
      required:
        - total_amount
        - payment_method
        - products
        - payment_data
      properties:
        total_amount:
          type: number
          format: double
          multipleOf: 0.01
          minimum: 0
          description: Importe total del pago.
          example: 12.5
        payment_method:
          type: string
          enum:
            - card
            - cash
            - transfer
          description: Tipo de pago.
          example: card
        products:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Product"
        payment_data:
          $ref: "#/components/schemas/PaymentData"

    PaymentResponse:
      type: object
      required:
        - transaction_id
        - status
      properties:
        transaction_id:
          type: string
          example: txn_8f14e45fceea167a
        status:
          type: string
          enum:
            - approved
          example: approved
        authorized_amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 12.5

    RefundRequestResponse:
      type: object
      required:
        - request_id
        - transaction_id
        - status
      properties:
        request_id:
          type: string
          example: req_21b3d9
        transaction_id:
          type: string
          example: txn_8f14e45fceea167a
        status:
          type: string
          enum:
            - pending
          example: pending

    RefundActionResponse:
      type: object
      required:
        - refund
        - balance
      properties:
        refund:
          $ref: "#/components/schemas/Refund"
        balance:
          type: number
          format: double
          multipleOf: 0.01
          description: Saldo restante de la moneda de la devolución.
          example: 1207.5

    Refund:
      type: object
      required:
        - id
        - transaction_id
        - amount
        - currency
        - client
        - reference
        - status
      properties:
        id:
          type: string
          example: ref_001
        transaction_id:
          type: string
          example: txn_8f14e45fceea167a
        reference:
          type: string
          description: Identificador corto del pago asociado.
          example: P-1048
        client:
          type: string
          description: Cliente que realizó el pago devuelto.
          example: Lucía García
        amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 12.5
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
          example: pending
        reason:
          type: string
          example: Producto defectuoso
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z

    Company:
      type: object
      required:
        - id
        - nombre
        - status
      properties:
        id:
          type: string
          example: emp_001
        nombre:
          type: string
          example: Comercio Ejemplo SL
        balance:
          type: number
          format: double
          multipleOf: 0.01
          example: 1250.75
        status:
          type: string
          enum:
            - activo
            - dado-de-baja
          description: Estado de la empresa. La baja es lógica y conserva el histórico.
          example: activo
        registered_at:
          type: string
          format: date-time
          example: 2026-09-12T09:00:00Z

    Payment:
      type: object
      required:
        - transaction_id
        - amount
        - currency
        - client
        - reference
        - invoice
        - payment_method
        - status
      properties:
        transaction_id:
          type: string
          example: txn_8f14e45fceea167a
        client:
          type: string
          description: Cliente que realizó el pago.
          example: Lucía García
        reference:
          type: string
          description: Identificador corto e visible del pago.
          example: P-1048
        invoice:
          type: string
          description: Número de factura del comercio.
          example: LH-F2026-1048
        amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 12.5
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        payment_method:
          type: string
          enum:
            - card
            - cash
            - transfer
          example: card
        status:
          type: string
          enum:
            - approved
            - rejected
          example: approved
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z

    TicketCreateRequest:
      type: object
      required:
        - company_id
        - subject
      properties:
        company_id:
          type: string
          example: emp_001
        company_name:
          type: string
          description: Si se omite, se resuelve a partir de `company_id`.
          example: Comercio Ejemplo SL
        subject:
          type: string
          maxLength: 140
          example: Pago rechazado en checkout
        description:
          type: string
          example: El comercio no puede completar el cobro en el terminal.
        status:
          type: string
          enum:
            - open
            - in_progress
            - closed
          default: open
          example: open

    TicketUpdateRequest:
      type: object
      description: Al menos uno de los campos es obligatorio.
      properties:
        status:
          type: string
          enum:
            - open
            - in_progress
            - closed
          example: in_progress
        reply:
          type: string
          description: Respuesta del equipo de soporte. Queda registrada en el historial.
          example: Estamos revisando la pasarela con el proveedor de pagos.

    TicketHistoryEntry:
      type: object
      required:
        - id
        - at
        - title
      properties:
        id:
          type: string
          example: tkt_001-h1
        at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z
        title:
          type: string
          example: Ticket abierto
        description:
          type: string
          example: Incidencia recibida desde el portal del comercio.
        author:
          type: string
          example: Equipo de soporte PLP

    TicketMessage:
      type: object
      required:
        - id
        - author
        - role
        - message
        - created_at
      properties:
        id:
          type: string
          example: "1086-m1"
        author:
          type: string
          example: Laura Martínez
        role:
          type: string
          enum:
            - comercio
            - tecnico
          example: tecnico
        message:
          type: string
          example: El abono tarda entre 2 y 5 días hábiles.
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:05:00Z

    Ticket:
      type: object
      required:
        - id
        - company_id
        - company_name
        - subject
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: tkt_001
        company_id:
          type: string
          example: emp_001
        company_name:
          type: string
          example: Comercio Ejemplo SL
        subject:
          type: string
          example: Pago rechazado en checkout
        description:
          type: string
          example: El comercio no puede completar el cobro en el terminal.
        status:
          type: string
          enum:
            - open
            - in_progress
            - closed
          example: open
        reply:
          type: string
          example: ""
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z
        history:
          type: array
          items:
            $ref: "#/components/schemas/TicketHistoryEntry"
        messages:
          type: array
          description: Conversación entre el comercio y el equipo de soporte.
          items:
            $ref: "#/components/schemas/TicketMessage"
