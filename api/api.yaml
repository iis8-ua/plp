openapi: 3.0.3
info:
  title: API TPV
  version: 1.0.0
  description: |
    API REST para PLP (Pasa la Pasta).

    Los importes se expresan con dos decimales (`number`, `format: double`, `multipleOf: 0.01`).
tags:
  - name: Autenticación
    description: Inicio y cierre de sesión.
  - name: Caja
    description: Retiradas, saldo y pagos.
  - name: Reembolsos
    description: Solicitud, aceptación, rechazo y consulta de reembolsos.
  - name: Empresas
    description: Gestión de empresas (sólo administrador).
  - name: Pagos
    description: Consulta de pagos efectuados.
  - name: Tickets
    description: Gestión de tickets.

paths:
  /login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión y obtener token Bearer
      description: |
        Autentica a la empresa usuaria. El nombre de usuario se envía como parámetro de consulta
        y la contraseña en el cuerpo. Si falla el parámetro `user` se responde 400; si el usuario
        no existe o la contraseña es incorrecta, 401.
      security: []
      parameters:
        - $ref: "#/components/parameters/User"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Todo correcto; devuelve el token Bearer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 3600
                user:
                  id: usr_tpv01
                  name: Laura Martínez
                  role: tecnico
                  subtitle: Técnica de soporte
        "400":
          description: No se ha indicado el parámetro `user` o la petición está mal formada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: MISSING_USER
                message: Falta el parámetro de consulta 'user'.
        "401":
          description: El usuario no existe o la contraseña es incorrecta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_CREDENTIALS
                message: Usuario o contraseña incorrectos.

  /logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: Invalida el token Bearer de la sesión actual.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Todo correcto; sesión cerrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Sesión cerrada correctamente.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Algo fue mal al cerrar la sesión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: LOGOUT_ERROR
                message: No se pudo cerrar la sesión.

  /withdraw:
    post:
      tags:
        - Caja
      summary: Retirar dinero del saldo de la empresa
      description: |
        Resta `amount` del saldo de la moneda indicada en `currency` (EUR por defecto).
        Un importe mal escrito o superior al saldo disponible de esa moneda produce un 400.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Amount"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Todo correcto; retirada realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawResponse"
        "400":
          description: El parámetro `amount` está mal escrito o es mayor que el saldo disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_AMOUNT
                message: El importe no es válido o supera el saldo disponible.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /balance:
    get:
      tags:
        - Caja
      summary: Consultar el saldo de la empresa autenticada
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve el saldo de la empresa autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pay:
    post:
      tags:
        - Caja
      summary: Registrar y procesar un pago
      description: |
        Registra una transacción aprobada para la empresa autenticada a partir del ticket del
        cuerpo (importe, método, productos y datos de pago). Un cuerpo mal formado devuelve 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "200":
          description: Todo correcto; pago realizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: El cuerpo de la petición está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: MALFORMED_BODY
                message: El cuerpo de la petición no es válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: El pago ha sido rechazado y no se abona al saldo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: PAYMENT_REJECTED
                message: El pago ha sido rechazado.
        "500":
          description: Ha habido un error al procesar el pago.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: PAYMENT_ERROR
                message: Error interno al procesar el pago.

  /refunds/request:
    post:
      tags:
        - Reembolsos
      summary: Solicitar un reembolso
      description: |
        Solicita el reembolso de una transacción de la empresa autenticada. La petición se acepta
        para su procesamiento (202). Si el `transaction_id` no existe o no pertenece a la empresa
        se responde 404; si ya hay una devolución pendiente, 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - name: reason
          in: query
          required: false
          description: Motivo indicado por el comercio al solicitar la devolución.
          schema:
            type: string
            maxLength: 200
          example: El cliente solicita devolver los artículos del pedido.
      responses:
        "202":
          description: Todo correcto; solicitud de reembolso aceptada para procesamiento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundRequestResponse"
        "409":
          description: Ya existe una devolución pendiente para esa transacción.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: REFUND_ALREADY_PENDING
                message: Ya existe una devolución pendiente para esa transacción.
        "400":
          description: El pago no está aprobado y no se puede devolver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: PAYMENT_NOT_REFUNDABLE
                message: Solo se pueden devolver pagos aprobados.
        "404":
          description: El `transaction_id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TRANSACTION_NOT_FOUND
                message: La transacción indicada no existe o su identificador no es válido.

  /refunds/accept:
    post:
      tags:
        - Reembolsos
      summary: Aceptar un reembolso
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RefundId"
      responses:
        "200":
          description: Todo correcto; reembolso aceptado y saldo descontado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: La devolución no existe o no pertenece a la empresa autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /refunds/reject:
    post:
      tags:
        - Reembolsos
      summary: Rechazar un reembolso
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RefundId"
      responses:
        "200":
          description: Todo correcto; reembolso rechazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: La devolución no existe o no pertenece a la empresa autenticada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /refunds:
    get:
      tags:
        - Reembolsos
      summary: Listar todos los reembolsos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve todos los reembolsos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /companies/add:
    put:
      tags:
        - Empresas
      summary: Añadir una empresa (sólo administrador)
      description: Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreateRequest"
      responses:
        "200":
          description: Todo correcto; empresa y cuenta de acceso creadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /companies/delete:
    delete:
      tags:
        - Empresas
      summary: Dar de baja una empresa (sólo administrador)
      description: |
        Baja lógica: la empresa deja de estar activa pero conserva su histórico.
        Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Todo correcto; empresa dada de baja.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El `id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: COMPANY_NOT_FOUND
                message: La empresa indicada no existe o su identificador no es válido.

  /companies/reactivate:
    put:
      tags:
        - Empresas
      summary: Reactivar una empresa dada de baja (sólo administrador)
      description: Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Todo correcto; empresa reactivada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El `id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: COMPANY_NOT_FOUND
                message: La empresa indicada no existe o su identificador no es válido.

  /companies:
    get:
      tags:
        - Empresas
      summary: Listar todas las empresas (sólo administrador)
      description: Requiere rol administrador.
      x-required-role: admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve todas las empresas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /payments:
    get:
      tags:
        - Pagos
      summary: Listar todos los pagos efectuados
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve todos los pagos efectuados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ticket/add:
    post:
      tags:
        - Tickets
      summary: Añadir un ticket
      description: La información del ticket se envía en el cuerpo de la petición.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreateRequest"
      responses:
        "200":
          description: Todo correcto; ticket añadido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ticket/delete:
    delete:
      tags:
        - Tickets
      summary: Eliminar un ticket (sólo administrador)
      description: Operación restringida al rol de administrador.
      x-required-role: admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Todo correcto; ticket eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Ticket eliminado correctamente.
        "403":
          $ref: "#/components/responses/Forbidden"

  /ticket/message:
    post:
      tags:
        - Tickets
      summary: Añadir un mensaje a la conversación del ticket
      description: |
        Añade un mensaje del usuario autenticado a la conversación del ticket. El autor y su
        rol se resuelven a partir del token. Un comercio solo puede escribir en sus tickets.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  maxLength: 1000
                  example: Gracias, todo aclarado.
      responses:
        "200":
          description: Todo correcto; ticket con el mensaje añadido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: El `id` no existe o no pertenece al comercio autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TICKET_NOT_FOUND
                message: El ticket indicado no existe o su identificador no es válido.

  /ticket/update:
    put:
      tags:
        - Tickets
      summary: Actualizar un ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdateRequest"
      responses:
        "200":
          description: Todo correcto; ticket actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: El `id` no existe o está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: TICKET_NOT_FOUND
                message: El ticket indicado no existe o su identificador no es válido.

  /tickets:
    get:
      tags:
        - Tickets
      summary: Listar todos los tickets
      description: |
        Devuelve los tickets del usuario autenticado. El rol `comercio` solo recibe los tickets
        de su empresa; los roles técnicos reciben todos.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve todos los tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ticket/assign:
    put:
      tags:
        - Tickets
      summary: Asignar un ticket a un técnico
      description: |
        El administrador puede asignar el ticket a cualquier técnico activo. Un técnico solo
        puede asignarse el ticket a sí mismo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketAssignRequest"
      responses:
        "200":
          description: Todo correcto; ticket asignado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El ticket no existe o no está accesible para el usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /technicians:
    get:
      tags:
        - Técnicos
      summary: Listar los técnicos (solo administrador)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devuelve los técnicos con su actividad.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Technician"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Técnicos
      summary: Crear un técnico (solo administrador)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicianCreateRequest"
      responses:
        "200":
          description: Técnico creado; incluye la contraseña inicial una sola vez.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechnicianCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /technicians/deactivate:
    put:
      tags:
        - Técnicos
      summary: Desactivar un técnico (solo administrador)
      description: |
        Marca al técnico como inactivo e invalida sus tokens. Un técnico inactivo no puede
        iniciar sesión ni usar la API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TechnicianId"
      responses:
        "200":
          description: Técnico desactivado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El técnico no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /technicians/reactivate:
    put:
      tags:
        - Técnicos
      summary: Reactivar un técnico (solo administrador)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TechnicianId"
      responses:
        "200":
          description: Técnico reactivado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Technician"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: El técnico no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /profile:
    get:
      tags:
        - Perfil
      summary: Consultar el perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario (y de su empresa si es un comercio).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - Perfil
      summary: Actualizar el perfil del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile/password:
    post:
      tags:
        - Perfil
      summary: Cambiar la contraseña del usuario autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: Token Bearer devuelto por `POST /login`. Caduca a los 3600 segundos; al caducar, la API responde 401.

  parameters:
    User:
      name: user
      in: query
      required: true
      description: Nombre de usuario. Si falta, la petición devuelve 400.
      schema:
        type: string
      example: tpv01
    Amount:
      name: amount
      in: query
      required: true
      description: Importe a retirar. Debe ser un número positivo con dos decimales como máximo y no superar el saldo de la moneda.
      schema:
        type: number
        format: double
        minimum: 0.01
        multipleOf: 0.01
      example: 25.5
    Currency:
      name: currency
      in: query
      required: false
      description: Moneda sobre la que se realiza la retirada. Por defecto `EUR`.
      schema:
        type: string
        enum:
          - EUR
          - USD
          - GBP
        default: EUR
      example: EUR
    TransactionId:
      name: transaction_id
      in: query
      required: true
      description: Identificador UUID de la transacción. Si no existe o está mal formado, la petición devuelve 404.
      schema:
        type: string
        format: uuid
      example: 8f14e45f-ceea-467a-9c1e-2b3c4d5e6f70
    RefundId:
      name: id
      in: query
      required: true
      description: Identificador UUID de la devolución.
      schema:
        type: string
        format: uuid
      example: 3f0b0a4e-8f0b-4f7a-9b4e-1c2d3e4f5a6b
    CompanyName:
      name: nombre
      in: query
      required: true
      description: Nombre de la empresa que se va a dar de alta.
      schema:
        type: string
        minLength: 1
      example: Librería Horizonte
    CompanyId:
      name: id
      in: query
      required: true
      description: Identificador UUID de la empresa.
      schema:
        type: string
        format: uuid
      example: 9a7c1d2e-3f4b-5c6d-7e8f-901a2b3c4d5e
    TicketId:
      name: id
      in: query
      required: true
      description: Número visible del ticket.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "1086"
    TechnicianId:
      name: id
      in: query
      required: true
      description: Identificador numérico del técnico.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "4"

  responses:
    BadRequest:
      description: La petición está mal formada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token Bearer ausente, inválido o caducado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: La operación requiere permisos de administrador.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Algo fue mal en el servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Código de error de la API.
          example: INVALID_REQUEST
        message:
          type: string
          description: Descripción legible del error.
          example: La petición no es válida.
        details:
          type: object
          additionalProperties: true
          description: Información adicional opcional sobre el error.

    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Operación realizada correctamente.

    LoginRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: Contraseña del usuario indicado en el parámetro de consulta `user`.
          example: mi-contrasena

    LoginResponse:
      type: object
      required:
        - token
        - token_type
        - user
      properties:
        token:
          type: string
          description: "Token Bearer a enviar en la cabecera `Authorization: Bearer <token>`."
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          enum:
            - Bearer
          example: Bearer
        expires_in:
          type: integer
          description: Validez del token en segundos.
          example: 3600
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          example: usr_tpv01
        name:
          type: string
          example: Laura Martínez
        role:
          type: string
          enum:
            - admin
            - tecnico
            - comercio
          description: Rol del usuario autenticado.
          example: tecnico
        subtitle:
          type: string
          example: Técnica de soporte
        force_password_change:
          type: boolean
          description: El usuario debe cambiar la contraseña al iniciar sesión.
          example: false
        company_id:
          type: string
          description: Sólo para el rol `comercio`.
          example: emp_001
        company_name:
          type: string
          description: Sólo para el rol `comercio`.
          example: Comercio Ejemplo SL

    BalanceResponse:
      type: object
      required:
        - company
        - balances
      properties:
        company:
          type: string
          description: Nombre de la empresa autenticada.
          example: Comercio Ejemplo SL
        balances:
          type: array
          description: Saldo disponible por moneda.
          items:
            $ref: "#/components/schemas/BalanceAccount"

    BalanceAccount:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 1000.0

    WithdrawResponse:
      type: object
      required:
        - withdrawn
        - currency
        - balance
      properties:
        withdrawn:
          type: number
          format: double
          multipleOf: 0.01
          example: 25.5
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        balance:
          type: number
          format: double
          multipleOf: 0.01
          description: Saldo restante de esa moneda tras la retirada.
          example: 1225.25

    Product:
      type: object
      required:
        - product_id
        - name
        - quantity
        - unit_price
      properties:
        product_id:
          type: string
          example: P-123
        name:
          type: string
          example: Café
        quantity:
          type: integer
          minimum: 1
          example: 2
        unit_price:
          type: number
          format: double
          multipleOf: 0.01
          minimum: 0
          example: 1.5

    PaymentData:
      type: object
      description: Datos de pago correspondientes al tipo de pago elegido.
      properties:
        card_number:
          type: string
          example: "4111111111111111"
        expiry:
          type: string
          example: 12/28
        cvv:
          type: string
          example: "123"
        holder:
          type: string
          example: J. Pérez
        iban:
          type: string
          example: ES9121000418450200051332
      additionalProperties: true

    PaymentRequest:
      type: object
      required:
        - total_amount
        - payment_method
        - products
        - payment_data
      properties:
        total_amount:
          type: number
          format: double
          multipleOf: 0.01
          minimum: 0
          description: Importe total del pago.
          example: 12.5
        payment_method:
          type: string
          enum:
            - card
            - cash
            - transfer
          description: Tipo de pago.
          example: card
        products:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Product"
        payment_data:
          $ref: "#/components/schemas/PaymentData"

    PaymentResponse:
      type: object
      required:
        - transaction_id
        - status
      properties:
        transaction_id:
          type: string
          example: txn_8f14e45fceea167a
        status:
          type: string
          enum:
            - approved
          example: approved
        authorized_amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 12.5
        balance:
          type: number
          format: double
          multipleOf: 0.01
          description: Saldo de la empresa en la moneda del pago tras el abono completo.
          example: 1262.5

    RefundRequestResponse:
      type: object
      required:
        - request_id
        - transaction_id
        - status
      properties:
        request_id:
          type: string
          example: req_21b3d9
        transaction_id:
          type: string
          example: txn_8f14e45fceea167a
        status:
          type: string
          enum:
            - pending
          example: pending

    RefundActionResponse:
      type: object
      required:
        - refund
        - balance
      properties:
        refund:
          $ref: "#/components/schemas/Refund"
        balance:
          type: number
          format: double
          multipleOf: 0.01
          description: Saldo restante de la moneda de la devolución.
          example: 1207.5

    Refund:
      type: object
      required:
        - id
        - transaction_id
        - amount
        - currency
        - client
        - reference
        - status
      properties:
        id:
          type: string
          example: ref_001
        transaction_id:
          type: string
          example: txn_8f14e45fceea167a
        reference:
          type: string
          description: Identificador corto del pago asociado.
          example: P-1048
        client:
          type: string
          description: Cliente que realizó el pago devuelto.
          example: Lucía García
        amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 12.5
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
          example: pending
        reason:
          type: string
          example: Producto defectuoso
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z

    Company:
      type: object
      required:
        - id
        - nombre
        - status
      properties:
        id:
          type: string
          example: 9a7c1d2e-3f4b-5c6d-7e8f-901a2b3c4d5e
        nombre:
          type: string
          example: Librería Horizonte
        status:
          type: string
          enum:
            - activo
            - dado-de-baja
          description: Estado de la empresa. La baja es lógica y conserva el histórico.
          example: activo
        registered_at:
          type: string
          format: date-time
          example: 2026-09-12T09:00:00Z
        razon_social:
          type: string
          example: Librería Horizonte, S.L.
        cif:
          type: string
          example: B12345678
        tipo_empresa:
          type: string
          example: Sociedad limitada
        actividad_economica:
          type: string
          example: Comercio al por menor de libros
        direccion:
          type: string
          example: Calle de Alcalá, 42 · Local 2
        codigo_postal:
          type: string
          example: "28014"
        ciudad:
          type: string
          example: Madrid
        provincia:
          type: string
          example: Madrid
        pais:
          type: string
          example: España
        telefono:
          type: string
          example: +34 912 345 678
        email:
          type: string
          format: email
          example: contacto@libreriahorizonte.es
        web:
          type: string
          example: https://libreriahorizonte.es

    Payment:
      type: object
      required:
        - transaction_id
        - amount
        - currency
        - client
        - reference
        - concept
        - payment_method
        - status
        - reason
      properties:
        transaction_id:
          type: string
          example: 8f14e45f-ceea-467a-9c1e-2b3c4d5e6f70
        client:
          type: string
          description: Cliente que realizó el pago (titular de la información de pago).
          example: Lucía García
        reference:
          type: string
          description: Identificador corto del pago.
          example: P-1048
        invoice:
          type: string
          nullable: true
          description: Número de factura del comercio, si existe.
          example: LH-F2026-1048
        concept:
          type: string
          description: Concepto de la transacción.
          example: Compra LH-F2026-1048
        amount:
          type: number
          format: double
          multipleOf: 0.01
          example: 12.5
        currency:
          type: string
          enum:
            - EUR
            - USD
            - GBP
          example: EUR
        payment_method:
          type: string
          enum:
            - card
            - cash
            - transfer
            - bizum
          example: card
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - refunded
          example: approved
        reason:
          type: string
          description: Motivo del último estado del pago.
          example: Pago correcto
        history:
          type: array
          items:
            $ref: "#/components/schemas/PaymentHistoryEntry"
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z

    PaymentHistoryEntry:
      type: object
      required:
        - id
        - status
        - created_at
      properties:
        id:
          type: string
          example: 4b1c2d3e-5f60-4718-9a2b-3c4d5e6f7081
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - refunded
          example: approved
        reason:
          type: string
          example: Pago correcto
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z

    TicketCreateRequest:
      type: object
      required:
        - company_id
        - subject
      properties:
        company_id:
          type: string
          example: emp_001
        company_name:
          type: string
          description: Si se omite, se resuelve a partir de `company_id`.
          example: Comercio Ejemplo SL
        subject:
          type: string
          maxLength: 140
          example: Pago rechazado en checkout
        description:
          type: string
          example: El comercio no puede completar el cobro en el terminal.
        status:
          type: string
          enum:
            - open
            - in_progress
            - closed
          default: open
          example: open

    TicketUpdateRequest:
      type: object
      description: Al menos uno de los campos es obligatorio.
      properties:
        status:
          type: string
          enum:
            - open
            - in_progress
            - closed
          example: in_progress
        reply:
          type: string
          description: Respuesta del equipo de soporte. Queda registrada en el historial.
          example: Estamos revisando la pasarela con el proveedor de pagos.

    TicketHistoryEntry:
      type: object
      required:
        - id
        - at
        - title
      properties:
        id:
          type: string
          example: tkt_001-h1
        at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z
        title:
          type: string
          example: Ticket abierto
        description:
          type: string
          example: Incidencia recibida desde el portal del comercio.
        author:
          type: string
          example: Equipo de soporte PLP

    TicketMessage:
      type: object
      required:
        - id
        - author
        - role
        - message
        - created_at
      properties:
        id:
          type: string
          example: "1086-m1"
        author:
          type: string
          example: Laura Martínez
        role:
          type: string
          enum:
            - comercio
            - tecnico
          example: tecnico
        message:
          type: string
          example: El abono tarda entre 2 y 5 días hábiles.
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:05:00Z

    Ticket:
      type: object
      required:
        - id
        - company_id
        - company_name
        - subject
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: "1086"
        company_id:
          type: string
          example: 9a7c1d2e-3f4b-5c6d-7e8f-901a2b3c4d5e
        company_name:
          type: string
          example: Librería Horizonte
        subject:
          type: string
          example: Pago rechazado en checkout
        description:
          type: string
          example: El comercio no puede completar el cobro en el terminal.
        status:
          type: string
          enum:
            - open
            - in_progress
            - closed
          example: open
        reply:
          type: string
          example: ""
        created_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-11-17T10:30:00Z
        history:
          type: array
          items:
            $ref: "#/components/schemas/TicketHistoryEntry"
        messages:
          type: array
          description: Conversación entre el comercio y el equipo de soporte.
          items:
            $ref: "#/components/schemas/TicketMessage"
        assignee:
          allOf:
            - $ref: "#/components/schemas/TicketAssignee"
          nullable: true

    TicketAssignee:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "3"
        name:
          type: string
          example: Laura Martínez

    TicketAssignRequest:
      type: object
      properties:
        technician_id:
          type: string
          description: Identificador del técnico (solo administrador).
          example: "4"
        assign_to_me:
          type: boolean
          description: Asigna el ticket al usuario autenticado.
          example: true
        unassign:
          type: boolean
          description: Retira el responsable actual. El técnico solo puede desasignarse sus propios tickets.
          example: false

    TechnicianActivity:
      type: object
      properties:
        assigned:
          type: integer
          example: 24
        open:
          type: integer
          example: 8
        in_progress:
          type: integer
          example: 8
        closed:
          type: integer
          example: 16

    Technician:
      type: object
      required:
        - id
        - name
        - email
        - username
        - role
        - status
      properties:
        id:
          type: string
          example: "4"
        name:
          type: string
          example: Carlos Ruiz
        email:
          type: string
          format: email
          example: carlos.ruiz@plp.es
        username:
          type: string
          example: cruiz
        role:
          type: string
          enum:
            - tecnico
          example: tecnico
        status:
          type: string
          enum:
            - Activo
            - Inactivo
          example: Activo
        activity:
          $ref: "#/components/schemas/TechnicianActivity"

    TechnicianCreated:
      allOf:
        - $ref: "#/components/schemas/Technician"
        - type: object
          required:
            - password
          properties:
            password:
              type: string
              description: Contraseña inicial; solo se devuelve al crear el técnico.
              example: PLP!Ana2026#

    TechnicianCreateRequest:
      type: object
      required:
        - name
        - email
        - username
        - password
      properties:
        name:
          type: string
          example: Ana López
        email:
          type: string
          format: email
          example: ana.lopez@plp.es
        username:
          type: string
          example: alopez
        password:
          type: string
          minLength: 8
          example: PLP!Ana2026#
        force_change:
          type: boolean
          default: true
          example: true

    Profile:
      type: object
      required:
        - id
        - name
        - email
        - username
        - role
        - status
      properties:
        id:
          type: string
          example: "3"
        name:
          type: string
          example: Laura Martínez
        email:
          type: string
          format: email
          example: laura.martinez@plp.es
        username:
          type: string
          example: lmartinez
        role:
          type: string
          enum:
            - admin
            - tecnico
            - comercio
          example: tecnico
        status:
          type: string
          enum:
            - Activo
            - Inactivo
          example: Activo
        company:
          allOf:
            - $ref: "#/components/schemas/Company"
          nullable: true
        activity:
          allOf:
            - $ref: "#/components/schemas/TechnicianActivity"
          nullable: true
        force_password_change:
          type: boolean
          example: false

    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Laura M. Martínez
        email:
          type: string
          format: email
          example: laura@plp.es
        nombre:
          type: string
          example: Librería Horizonte Centro
        razon_social:
          type: string
        cif:
          type: string
        tipo_empresa:
          type: string
        actividad_economica:
          type: string
        direccion:
          type: string
        codigo_postal:
          type: string
        ciudad:
          type: string
        provincia:
          type: string
        pais:
          type: string
        telefono:
          type: string
        web:
          type: string

    PasswordChangeRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          example: comercio
        new_password:
          type: string
          format: password
          minLength: 8
          example: NuevaClave123

    CompanyCreateRequest:
      type: object
      required:
        - nombre
        - razon_social
        - cif
        - tipo_empresa
        - actividad_economica
        - direccion
        - codigo_postal
        - ciudad
        - provincia
        - pais
        - telefono
        - email
        - username
        - password
      properties:
        nombre:
          type: string
          example: Librería Horizonte
        razon_social:
          type: string
          example: Librería Horizonte, S.L.
        cif:
          type: string
          example: B12345678
        tipo_empresa:
          type: string
          example: Sociedad limitada
        actividad_economica:
          type: string
          example: Comercio al por menor de libros
        direccion:
          type: string
          example: Calle de Alcalá, 42 · Local 2
        codigo_postal:
          type: string
          example: "28014"
        ciudad:
          type: string
          example: Madrid
        provincia:
          type: string
          example: Madrid
        pais:
          type: string
          example: España
        telefono:
          type: string
          example: +34 912 345 678
        email:
          type: string
          format: email
          example: contacto@libreriahorizonte.es
        web:
          type: string
          example: https://libreriahorizonte.es
        username:
          type: string
          description: Usuario de acceso al portal del comercio.
          example: libreriahorizonte
        password:
          type: string
          minLength: 8
          description: Contraseña inicial del comercio.
          example: PLP!Libreria2026#
        force_change:
          type: boolean
          default: true
          description: Obliga a cambiar la contraseña en el primer acceso.
          example: true

    CompanyCreated:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required:
            - username
            - password
          properties:
            username:
              type: string
              example: libreriahorizonte
            password:
              type: string
              description: Contraseña inicial; solo se devuelve al crear el comercio.
              example: PLP!Libreria2026#
