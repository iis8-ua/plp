name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobación del proyecto Django
        run: python manage.py check

      - name: Comprobar que no faltan migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Tests del backend
        run: python manage.py test api pagos -v 2

      - name: Validar el OpenAPI generado desde el código
        run: python manage.py spectacular --file /tmp/api.from-code.yaml --validate
