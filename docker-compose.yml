services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tpv}
      MYSQL_USER: ${MYSQL_USER:-tpv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tpvpass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-rootpass}']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ENGINE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tpv}
      MYSQL_USER: ${MYSQL_USER:-tpv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tpvpass}
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn tpv.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  mysql_data:
